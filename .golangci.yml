version: "2"
linters:
  enable:
    - godoclint
    - gochecknoinits
    # Catches a parameter or variable shadowing a predeclared identifier (new,
    # len, min, cap). It matters most in exported signatures, which render on
    # pkg.go.dev: see Replace, whose replacement argument is repl for this reason
    # even though strings.Replace names it new.
    - predeclared
    # Flags fmt.Errorf with no formatting verbs, which is errors.New spelled at
    # the cost of a parse. Keeps the errors.New sweep from regressing one call
    # at a time.
    - perfsprint
    # Mirror of perfsprint above, for the other end of the errors.New sweep:
    # this package wraps consistently with fmt.Errorf("...: %w", err), and
    # errorlint is what catches a wrap silently losing its %w, or a caller
    # comparing an error with == / a type assertion instead of errors.Is/As.
    - errorlint
    # Exported doc comments here are the package's whole surface on
    # pkg.go.dev; a typo in one ships to readers, not just to us. Fast,
    # auto-fixable, effectively no false positives.
    - misspell
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
      - linters:
          - staticcheck
        text: "QF1003"
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
