# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

# https://github.com/actions/checkout
# https://github.com/golangci/golangci-lint-action
# https://github.com/actions/setup-go

name: Go
permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    strategy:
      # Report both versions rather than cancelling the matrix on the first
      # failure: knowing whether a break is version-specific is the point.
      fail-fast: false
      matrix:
        # '1.23' is the floor declared in go.mod and must keep working for
        # anyone on it; 'stable' is the current release, and catches a new
        # gofmt, vet check, or stdlib behaviour before a user reports it.
        # Bump the pinned value together with the go directive in go.mod.
        go-version: ['1.23', 'stable']
    name: build (go ${{ matrix.go-version }})
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}

    - name: Install golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
          install-only: true

    - name: Version
      run: make version

    - name: Lint
      run: make lint

    - name: Build
      run: make build

    - name: Test
      run: make test

    # The immutability guarantee — collection functions never mutate or alias
    # their arguments — exists so one template can render over shared data from
    # many goroutines. TestConcurrentTemplateExecution is what puts real
    # goroutines on that data; this step is what makes a regression in it fail a
    # pull request rather than wait for someone to run make race by hand.
    - name: Race
      run: make race
